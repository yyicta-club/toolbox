[project]
name = "yyict-toolbox"
version = "0.1.0"
description = "A plugin-based campus utility toolbox"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25,<26",
    "pluggy>=1.5,<2",
    "PySide6_Essentials==6.9.3",
]

[project.scripts]
yyict-toolbox = "yyict_toolbox.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6.10,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yyict_toolbox = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
